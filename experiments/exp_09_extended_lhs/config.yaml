#   rel_migration = 0.5 (model.py::make_sim)
#   ART driven by data/p_art.csv
#   Condoms: aggressive schedule from exp_06 (locked via runner)

priors:
  hiv.beta_m2f:              {low: 0.005, high: 0.04, log: false}
  hiv.rel_init_prev:         {low: 0.3,   high: 1.5,  log: false}
  hiv.dur_on_art:            {low: 8,     high: 25,   log: false}
  hiv.rel_death:             {low: 0.5,   high: 2.5,  log: false}
  hiv.rel_death_on_art:      {low: 0.1,   high: 2.0,  log: false}
  structuredsexual.prop_f0:  {low: 0.55,  high: 0.90, log: false}
  structuredsexual.m2_conc:  {low: 2.0,   high: 8.0,  log: false}
  structuredsexual.dur_sw:   {low: 2,     high: 15,   log: false}

gof:
  target_years: [1990, 1995, 2000, 2005, 2010, 2015, 2020]
  metrics:
    - hiv.prevalence_15_49
    - hiv.prevalence_f
    - hiv.prevalence_m
    - hiv.n_infected
